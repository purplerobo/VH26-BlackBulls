name: LeakGuard CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  leakguard-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn joblib google-genai

      - name: Run LeakGuard Full Scan (AST + ML 3-Tier)
        run: |
          echo "=========================================="
          echo "   LEAKGUARD CI/CD PIPELINE STARTED"
          echo "=========================================="
          echo ""
          echo "Step 1: Running benchmark to verify accuracy..."
          python cli.py benchmark || true
          echo ""
          echo "Step 2: Scanning entire repo for leaks..."
          python cli.py . --strict
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8

  leakguard-fix:
    needs: leakguard-scan
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn joblib google-genai

      - name: Generate Auto-Fix Report
        run: |
          echo "=========================================="
          echo "   LEAKGUARD AUTO-FIX REPORT"
          echo "=========================================="
          python cli.py . --fix --yes 2>&1 | tee fix-report.txt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8

      - name: Upload Fix Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leakguard-fix-report
          path: fix-report.txt
