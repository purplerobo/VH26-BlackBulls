name: LeakGuard CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  leakguard-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn joblib google-genai

      - name: Run LeakGuard Full Scan (AST + ML 3-Tier)
        run: |
          echo "=========================================="
          echo "   LEAKGUARD CI/CD PIPELINE STARTED"
          echo "=========================================="
          echo ""
          echo "Step 1: Running benchmark to verify accuracy..."
          python cli.py benchmark || true
          echo ""
          echo "Step 2: Scanning entire repo for leaks..."
          python cli.py . --strict
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8

      - name: ML Confidence Score Summary
        if: always()
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          from analyzer.checker import analyze_file
          try:
              from ml_pipeline.predictor import get_leak_confidence, categorize_risk
              has_ml = True
          except Exception:
              has_ml = False

          print('')
          print('============================================')
          print('   ML CONFIDENCE SCORES - PER FILE')
          print('============================================')
          print('')
          print(f'{\"FILE\":<55} {\"STATUS\":<12} {\"CONFIDENCE\":<12} {\"ACTION\":<15}')
          print('-' * 94)

          for root, _, files in os.walk('.'):
              if 'node_modules' in root or '.git' in root:
                  continue
              for f in files:
                  if f.endswith('.py'):
                      path = os.path.join(root, f)
                      leaks = analyze_file(path)
                      has_leak = any(l['status'] == 'LEAK' for l in leaks)
                      uncertain = [l for l in leaks if l['status'] == 'UNCERTAIN']

                      if has_leak:
                          print(f'{path:<55} {\"LEAK\":<12} {\"N/A (AST)\":<12} {\"BLOCK_BUILD\":<15}')
                      elif uncertain and has_ml:
                          conf = get_leak_confidence(path)
                          if conf is not None:
                              risk = categorize_risk(conf)
                              print(f'{path:<55} {\"UNCERTAIN\":<12} {conf:.1f}%{\"\":<7} {risk[\"action\"]:<15}')
                          else:
                              print(f'{path:<55} {\"UNCERTAIN\":<12} {\"NO MODEL\":<12} {\"WARN_ONLY\":<15}')
                      else:
                          print(f'{path:<55} {\"SAFE\":<12} {\"N/A\":<12} {\"PASS\":<15}')
          print('')
          print('============================================')
          print('   END OF ML ANALYSIS')
          print('============================================')
          "
        env:
          PYTHONIOENCODING: utf-8

  leakguard-fix:
    needs: leakguard-scan
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn joblib google-genai

      - name: Generate Auto-Fix Report
        run: |
          echo "=========================================="
          echo "   LEAKGUARD AUTO-FIX REPORT"
          echo "=========================================="
          python cli.py . --fix --yes 2>&1 | tee fix-report.txt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8

      - name: Upload Fix Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leakguard-fix-report
          path: fix-report.txt
