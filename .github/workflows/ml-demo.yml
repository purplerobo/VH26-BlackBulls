name: LeakGuard ML Pipeline Demo

on:
  workflow_dispatch:
  push:
    paths:
      - "test_repo/**"

jobs:
  ml-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn joblib

      - name: Train ML Model
        run: |
          echo "=========================================="
          echo "   TRAINING LEAK DETECTION MODEL"
          echo "=========================================="
          python ml_pipeline/dataset_builder.py
          python ml_pipeline/train_model.py

      - name: Run Full ML Pipeline Demo
        run: |
          echo "=========================================="
          echo "   ML 3-TIER RISK CATEGORIZATION DEMO"
          echo "=========================================="
          echo ""
          echo "--- Scanning test_repo with ML analysis ---"
          python cli.py test_repo --strict
        env:
          PYTHONIOENCODING: utf-8

      - name: Show ML Confidence Scores
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          from analyzer.checker import analyze_file

          try:
              from ml_pipeline.predictor import get_leak_confidence, categorize_risk
              has_ml = True
          except:
              has_ml = False

          print('')
          print('=' * 50)
          print('   ML CONFIDENCE SCORES PER FILE')
          print('=' * 50)

          for root, _, files in os.walk('test_repo'):
              for f in files:
                  if f.endswith('.py'):
                      path = os.path.join(root, f)
                      leaks = analyze_file(path)
                      uncertain = [l for l in leaks if l['status'] == 'UNCERTAIN']
                      if uncertain and has_ml:
                          conf = get_leak_confidence(path)
                          if conf is not None:
                              risk = categorize_risk(conf)
                              print(f'{risk[\"color\"]}{risk[\"label\"]}{risk[\"reset\"]} | {path} | Confidence: {conf:.1f}% | Action: {risk[\"action\"]}')
                          else:
                              print(f'NO MODEL   | {path} | No trained model found')
          print('=' * 50)
          "
        env:
          PYTHONIOENCODING: utf-8
